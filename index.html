<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a" id="metaThemeColor">
  <meta name="description" content="通用多行程旅遊助手 PWA：互動地圖兩點測距、行程拖曳、旅伴分帳、待辦打包與 AI 行程匯入">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="旅遊助手">
  <title>VoyageOS · 通用旅遊助手</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- SHA-256 Lock Gate (same password as legacy Travel-app) -->
  <div id="lockGate" class="lock-gate" hidden>
    <div class="lock-card">
      <div class="lock-logo-ring">
        <img src="assets/icon-192.png" width="56" height="56" alt="">
      </div>
      <h1>旅遊助手 · VoyageOS</h1>
      <p class="muted">公開頁面已上鎖，輸入密碼即可檢視與編輯所有旅程。</p>
      <form id="lockForm" autocomplete="current-password">
        <label class="sr-only" for="lockPassword">密碼</label>
        <input id="lockPassword" class="input lock-input" type="password" name="password" placeholder="請輸入解鎖密碼" required autofocus>
        <button type="submit" class="btn btn-primary btn-block">解鎖進入 →</button>
        <p id="lockError" class="lock-error" hidden></p>
      </form>
    </div>
  </div>

  <!-- Main App Shell -->
  <div class="app-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="trip-pill-btn" data-action="open-trip-deck" aria-label="切換或新增旅程">
          <span class="trip-pill-emoji" id="topTripEmoji">🌺</span>
          <span class="trip-pill-text">
            <span class="trip-pill-title" id="topTripTitle">載入旅程中…</span>
            <span class="trip-pill-sub" id="topTripSub">點擊切換／新增行程</span>
          </span>
          <span class="trip-pill-caret">▾</span>
        </button>
      </div>

      <div class="topbar-actions">
        <button type="button" class="search-trigger-btn" data-action="open-search" aria-label="全站搜尋 (Ctrl+K)">
          <span>🔍</span>
          <span class="search-trigger-text">搜尋景點 / MapCode / 訂單…</span>
          <kbd class="search-kbd">⌘K</kbd>
        </button>
        <button type="button" class="icon-pill-btn" data-action="open-ai-hub" title="AI 匯入新行程">
          <span>✨</span><span class="hide-xs">AI 匯入</span>
        </button>
        <button type="button" class="icon-pill-btn" data-action="toggle-theme" id="themeToggleBtn" aria-label="切換深淺色主題" title="切換深淺色">
          🌙
        </button>
      </div>
    </header>

    <input type="file" id="importFile" accept="application/json,.json" class="sr-only" hidden>

    <!-- Workspace: Desktop Sidebar + Main View -->
    <div class="workspace">
      <aside class="sidebar" id="desktopSidebar" aria-label="桌面版側邊選單"></aside>

      <main class="main-stage" id="mainStage">
        <section class="panel" id="view-overview" data-view="overview"></section>
        <section class="panel" id="view-itinerary" data-view="itinerary"></section>
        <section class="panel" id="view-places" data-view="places"></section>
        <section class="panel" id="view-expenses" data-view="expenses"></section>
        <section class="panel" id="view-todos" data-view="todos"></section>
        <section class="panel" id="view-bookings" data-view="bookings"></section>
        <section class="panel" id="view-shopping" data-view="shopping"></section>
        <section class="panel" id="view-packing" data-view="packing"></section>
        <section class="panel" id="view-journal" data-view="journal"></section>
        <section class="panel" id="view-notes" data-view="notes"></section>
      </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav" aria-label="手機版底部選單"></nav>

    <!-- Mobile "More" Bento Sheet -->
    <div class="bento-sheet-backdrop" id="moreSheetBackdrop">
      <div class="bento-sheet" role="dialog" aria-label="更多功能選單">
        <div class="sheet-handle"><span></span></div>
        <div class="bento-sheet-head">
          <strong>全部功能模組</strong>
          <button type="button" class="icon-btn" data-action="close-more">✕</button>
        </div>
        <div class="bento-grid" id="moreBentoGrid"></div>
      </div>
    </div>
  </div>

  <!-- Global Instant Search Modal (⌘K) -->
  <div class="modal-backdrop" id="searchBackdrop" role="dialog" aria-modal="true" aria-label="快速搜尋">
    <div class="modal search-modal">
      <div class="search-input-row">
        <span class="search-ico">🔍</span>
        <input type="search" id="globalSearchInput" class="search-Modal-input" placeholder="輸入關鍵字：景點、MapCode、訂單號、待辦、花費…" autocomplete="off">
        <button type="button" class="btn btn-ghost btn-sm" data-action="close-search">關閉</button>
      </div>
      <div id="globalSearchResults" class="search-results"></div>
    </div>
  </div>

  <!-- Universal Edit / Create Form Modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">編輯</h3>
        <button type="button" class="icon-btn" id="modalCloseX" aria-label="關閉">✕</button>
      </div>
      <div id="modalFields" class="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger btn-sm" id="modalDelete" hidden>刪除</button>
        <div class="modal-actions-right">
          <button type="button" class="btn btn-ghost btn-sm" id="modalCancel">取消</button>
          <button type="button" class="btn btn-primary btn-sm" id="modalSave">儲存變更</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Expandable Rich Guide / Reference Detail Sheet -->
  <dialog id="detailDialog" class="detail-dialog" aria-labelledby="detailTitle">
    <div class="detail-sheet" id="detailSheet">
      <div class="sheet-handle" aria-hidden="true"><span></span></div>
      <div class="detail-toolbar">
        <h3 id="detailTitle" class="detail-title">詳情攻略</h3>
        <button type="button" class="icon-btn detail-close" data-action="close-detail" aria-label="關閉詳情">✕</button>
      </div>
      <div id="detailBody" class="detail-body"></div>
    </div>
  </dialog>

  <!-- Full-screen Image Lightbox -->
  <dialog id="lightboxDialog" class="lightbox-dialog" aria-label="圖片放大預覽">
    <button type="button" class="lightbox-close icon-btn" data-action="close-lightbox" aria-label="關閉圖片">✕</button>
    <figure class="lightbox-figure">
      <img id="lightboxImg" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/seed-bundle.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
